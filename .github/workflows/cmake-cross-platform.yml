name: Cross-Platform Build (wxWidgets port)

on:
  push:
    branches: [ main, "porting/**" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwxgtk3.2-dev libwxgtk-media3.2-dev \
            cmake ninja-build pkg-config \
            libgtk-3-dev \
            build-essential

      - name: Configure (CMake)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-macos:
    name: Build (macOS 14, Apple Silicon, winport)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # macOS は winport 版（sakura_core フォーク + Win32 互換層）。Windows ヘッダとして mingw-w64 を使う
        run: brew install mingw-w64 cmake ninja

      - name: Fetch submodules
        run: git submodule update --init --depth 1 externals/cmigemo externals/miniz-cpp

      - name: Configure (CMake)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
