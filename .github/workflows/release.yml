name: Release Packaging

on:
  push:
    tags:
      - 'wxport-v*'   # 例: wxport-v0.1.0 で起動
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Manual tag name (e.g. wxport-v0.1.0-test)'
        required: true
        default: 'wxport-v0.0.0-manual'

jobs:
  # ------------------------------------------------------------
  # macOS .app バンドル → .dmg
  # ------------------------------------------------------------
  package-macos:
    name: Package (macOS, Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install wxwidgets cmake ninja create-dmg

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Verify tests
        run: ctest --test-dir build --output-on-failure

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create DMG
        run: |
          create-dmg \
            --volname "SakuraEditor (wx)" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "sakura_wx.app" 175 120 \
            --hide-extension "sakura_wx.app" \
            --app-drop-link 425 120 \
            "SakuraEditor-${{ steps.ver.outputs.tag }}-macOS-arm64.dmg" \
            "build/bin/sakura_wx.app"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraEditor-${{ steps.ver.outputs.tag }}-macOS-arm64
          path: SakuraEditor-*.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SakuraEditor-*.dmg
          fail_on_unmatched_files: true

  # ------------------------------------------------------------
  # Linux AppImage
  # ------------------------------------------------------------
  package-linux:
    name: Package (Linux x86_64 AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwxgtk3.2-dev libwxgtk-media3.2-dev \
            cmake ninja-build pkg-config \
            libgtk-3-dev build-essential \
            libfuse2 fuse imagemagick

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Verify tests
        run: ctest --test-dir build --output-on-failure

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/sakura_wx AppDir/usr/bin/sakura_wx

          cat > AppDir/usr/share/applications/sakura_wx.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=SakuraEditor (wx)
          Comment=Japanese text editor (wxWidgets port)
          Exec=sakura_wx %F
          Icon=sakura_wx
          Categories=Utility;TextEditor;
          MimeType=text/plain;
          Terminal=false
          EOF

          # 仮アイコン（後で正規アイコンに置換）。256×256 PNG を生成。
          convert -size 256x256 xc:white -gravity center \
            -font 'DejaVu-Sans-Bold' -pointsize 48 -fill black \
            -annotate +0+0 'Sakura' \
            AppDir/usr/share/icons/hicolor/256x256/apps/sakura_wx.png
          # AppRun 用に root にもコピー
          cp AppDir/usr/share/icons/hicolor/256x256/apps/sakura_wx.png AppDir/sakura_wx.png
          cp AppDir/usr/share/applications/sakura_wx.desktop AppDir/sakura_wx.desktop

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          DEPLOY_GTK_VERSION=3 \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --output appimage \
            --desktop-file AppDir/sakura_wx.desktop

          mv SakuraEditor*.AppImage \
             "SakuraEditor-${{ steps.ver.outputs.tag }}-linux-x86_64.AppImage" || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraEditor-${{ steps.ver.outputs.tag }}-linux-x86_64
          path: SakuraEditor-*.AppImage

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SakuraEditor-*.AppImage
          fail_on_unmatched_files: true
